name: moteur_exercices
description: Moteurs et gabarits d'exercices Yasmina, partagés par l'app mobile et l'aperçu web.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Compatible web : pas de dart:io, pas de plugin sans support web.
dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1

flutter:
  # Licences des polices, affichées par enregistrerLicencesPolices().
  assets:
    - fonts/OFL-NotoNaskhArabic.txt
    - fonts/OFL-BalooBhaijaan2.txt
    - fonts/OFL-Andika.txt
    # Mascotte, copiée de docs/design-system/yasmina par tool/generer_theme.dart.
    - assets/yasmina/
  # Polices embarquées (voir fonts/README.md), utilisées avec le préfixe
  # packages/moteur_exercices/ (constantes de PolicesYasmina).
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: fonts/NotoNaskhArabic-Regular.ttf
        - asset: fonts/NotoNaskhArabic-SemiBold.ttf
          weight: 600
        - asset: fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: BalooBhaijaan2
      fonts:
        - asset: fonts/BalooBhaijaan2-Regular.ttf
        - asset: fonts/BalooBhaijaan2-SemiBold.ttf
          weight: 600
        - asset: fonts/BalooBhaijaan2-Bold.ttf
          weight: 700
        - asset: fonts/BalooBhaijaan2-ExtraBold.ttf
          weight: 800
    - family: Andika
      fonts:
        - asset: fonts/Andika-Regular.ttf
        - asset: fonts/Andika-Bold.ttf
          weight: 700
